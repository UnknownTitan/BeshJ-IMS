# PostgreSQL 16 for local development.
# First start loads every numbered script in database/ automatically.
# When a new script is added (05_...), add it below and recreate: docker compose down -v && docker compose up -d
# To start again from a clean database:  docker compose down -v && docker compose up -d
services:
  db:
    image: postgres:16
    container_name: besh-ims-db
    environment:
      POSTGRES_DB: besh_ims
      POSTGRES_USER: besh
      POSTGRES_PASSWORD: besh_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - besh_pgdata:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql:ro
      - ./database/03_phase0_additions.sql:/docker-entrypoint-initdb.d/03_phase0_additions.sql:ro
      - ./database/04_phase2_purchasing.sql:/docker-entrypoint-initdb.d/04_phase2_purchasing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U besh -d besh_ims"]
      interval: 5s
      retries: 10

volumes:
  besh_pgdata:
